name: run-ci-on-changes
on:
  push:
    branch: ci

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: install debian dependencies
        run: sudo apt-get -y install meson check gettext sphinx-doc
      - name: checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: build and run tests
        id: buildtests
        run: |
          mkdir build
          cd build
          meson setup --prefix=$HOME/local
          ninja
          meson test
        continue-on-error: true
      - name: install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_GERRITHUB_KEY }}
          name: id_rsa # optional
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: replace # replace / ignore / fail; optional (defaults to fail)
      - name: send ci result
        run: |
          commit=$(git rev-parse HEAD)
          label=-1
          echo "test ${{ steps.buildtests.outcome }} = 'success'"
          test steps.buildtests.status = 'success' && label=+1
          ssh -p 29418 mmlabs-foss-ci@review.gerrithub.io gerrit review --verified $label $commit
